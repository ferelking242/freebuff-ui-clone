<!-- ======================= APPLICATION ======================= -->
<div class="app">

  <header class="topbar">
    <div class="seg" id="seg">
      <button class="on" data-mode="Code">Code</button>
      <button data-mode="Chat">Chat</button>
    </div>
    <div class="tabs" id="tabs"></div>
    <button class="tab-new" id="newTab" title="Nouvel onglet"><svg class="i"><use href="#i-plus"/></svg></button>
  </header>

  <div class="main">
    <nav class="rail">
      <button class="rail-btn active" id="railHome" title="Accueil"><svg class="i"><use href="#i-home"/></svg></button>
      <button class="rail-btn" id="railProjects" title="Projets"><svg class="i"><use href="#i-grid"/></svg></button>
      <button class="rail-btn" id="railPanels" title="Panneaux"><svg class="i"><use href="#i-layout"/></svg></button>
      <button class="rail-btn" id="railSettings" title="Réglages"><svg class="i"><use href="#i-gear"/></svg></button>
      <button class="rail-btn" id="railGift" title="Inviter"><svg class="i"><use href="#i-gift"/></svg></button>

      <div class="rail-bottom">
        <button class="rail-btn sm" id="railHelp" title="Aide"><svg class="i"><use href="#i-help"/></svg></button>
        <button class="avatar" id="avatar" title="Compte">A</button>
      </div>
    </nav>

    <section class="pane">
      <div class="feed" id="feed"></div>

      <div class="composer">
        <div class="chips" id="chips" hidden></div>
        <textarea class="field" id="input" rows="1" placeholder="Ask Freebuff... Use / for commands, @ for files"></textarea>

        <div class="modes" id="modes">
          <button class="on" data-mode="Build">Build</button>
          <button data-mode="Plan">Plan</button>
          <button data-mode="Mission">Mission</button>
          <button data-mode="Skills">Skills</button>
        </div>

        <div class="composer-row">
          <button class="ghost" id="attach" title="Joindre un fichier"><svg class="i"><use href="#i-plus"/></svg></button>
          <input type="file" id="file" multiple hidden />
          <button class="model" id="modelBtn" title="Choisir le modèle">
            <span id="modelName">DeepSeek V4.1 Flash</span>
            <em id="modelEffort">High</em>
            <svg class="i"><use href="#i-chev-d"/></svg>
          </button>
          <button class="mic" id="mic" title="Dicter"><svg class="i"><use href="#i-mic"/></svg></button>
          <button class="send" id="send" title="Envoyer" disabled><svg class="i"><use href="#i-arrow-up"/></svg></button>
        </div>
      </div>

      <div class="terminal" id="terminal" hidden>
        <div class="term-head">
          <svg class="i"><use href="#i-terminal"/></svg>
          <span>Terminal</span>
          <button class="raw" id="termClose" title="Fermer"><svg class="i x"><use href="#i-x"/></svg></button>
          <div class="term-tools">
            <button class="raw" id="termNew" title="Nouveau terminal"><svg class="i"><use href="#i-plus"/></svg></button>
            <button class="raw" id="termSide" title="Panneaux"><svg class="i"><use href="#i-sidebar"/></svg></button>
          </div>
        </div>
        <div class="term-body">
          <div class="term-out" id="termOut"></div>
          <form class="term-input-wrap" id="termForm">
            <span>$</span>
            <input id="termInput" autocomplete="off" spellcheck="false" placeholder="Commande (help)" />
          </form>
        </div>
      </div>
    </section>

    <div class="scrim" id="scrim" hidden></div>

    <aside class="drawer" id="drawer" hidden>
      <div class="drawer-head">
        <span class="logo">Freebuff</span>
        <div class="drawer-tools">
          <button class="raw" id="drawerSearch" title="Rechercher"><svg class="i"><use href="#i-search"/></svg></button>
          <button class="raw" id="drawerClose" title="Fermer"><svg class="i"><use href="#i-sidebar"/></svg></button>
        </div>
      </div>

      <div class="drawer-scroll" id="drawerScroll">
        <button class="item" id="newChat"><svg class="i"><use href="#i-newchat"/></svg><span>New chat</span></button>
        <button class="item" id="newProject"><svg class="i"><use href="#i-newproj"/></svg><span>New project</span></button>
        <button class="item" id="dailyHours"><svg class="i"><use href="#i-hourglass"/></svg><span>Daily hours</span><em class="badge" id="hoursBadge">3:00</em></button>
        <button class="item" id="getUsage"><svg class="i"><use href="#i-trend"/></svg><span>Get 7x usage for $8</span></button>

        <div class="section" id="projectsSection">
          <span>Projects</span>
          <span class="section-tools"><svg class="i"><use href="#i-folder"/></svg><svg class="i"><use href="#i-chev-d"/></svg></span>
        </div>

        <div class="project-head">
          <svg class="i"><use href="#i-folder"/></svg>
          <span id="projectName">Tu Va Clone</span>
          <button class="raw" id="projectMenu" title="Options du projet"><svg class="i mini"><use href="#i-dots"/></svg></button>
          <button class="raw" id="projectNew" title="Discussion dans ce projet"><svg class="i mini"><use href="#i-newchat"/></svg></button>
        </div>

        <div id="threadList"></div>

        <button class="item legacy" id="legacyBtn"><svg class="i"><use href="#i-clock"/></svg><span>Legacy</span></button>
      </div>

      <div class="drawer-foot">
        <button class="item" id="invite"><svg class="i"><use href="#i-gift"/></svg><span>Invite friends</span><em class="count">0/3</em></button>
        <button class="streak" id="streakBtn">
          <span>🔥</span><span>1-day streak</span>
          <span class="bars"><i class="on"></i><i></i><i></i><i></i><i></i><i></i></span>
        </button>
      </div>
    </aside>
  </div>
</div>

<div class="sheet-scrim" id="sheet" hidden>
  <div class="sheet" id="sheetPanel" role="dialog" aria-modal="true"></div>
</div>
<div class="toast" id="toast" hidden></div>

<script src="app.js"></script>
</body>
</html>
